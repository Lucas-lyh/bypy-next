name: Publish bypy-next to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Check release tag against package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path
          wheel = next(Path('dist').glob('*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              name = next(n for n in archive.namelist() if n.endswith('.dist-info/METADATA'))
              version = BytesParser().parsebytes(archive.read(name))['Version']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must be v' + version)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Test installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          bypy -V
          bypy --help
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v

  publish:
    if: github.event_name == 'release'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bypy-next/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI using OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
